name: infinibay-backend
description: Infinibay Backend profile with KVM access and persistent data
config: {}
devices:
  backend-data:
    type: disk
    source: {{INFINIBAY_DIR}}/data/backend
    path: /data
  kvm:
    type: unix-char
    source: /dev/kvm
    path: /dev/kvm
  http-proxy:
    type: proxy
    listen: tcp:0.0.0.0:4000
    connect: tcp:127.0.0.1:4000
    bind: host
