name: infinibay-frontend
description: Infinibay Frontend profile with persistent data
config: {}
devices:
  frontend-data:
    type: disk
    source: {{INFINIBAY_DIR}}/data/frontend
    path: /data
  http-proxy:
    type: proxy
    listen: tcp:0.0.0.0:3000
    connect: tcp:127.0.0.1:3000
    bind: host
