# Infinibay — Docker dev stack (hot-reload, for Mac / any Docker host)
#
# This is the SIMPLE developer environment. It does NOT replace the LXD
# production path (setup.sh / run.sh); it lives alongside it.
#
# Source code is git-cloned by ./dev.sh into ${REPOS_DIR} (default ./repos) and
# BIND-MOUNTED into the containers, so edits on your host are picked up live:
#   - backend   : ts-node under nodemon  → restarts on change
#   - frontend  : next dev               → hot module reload
#   - infinization : tsc --watch (inside the backend container) → rebuilds dist/
#
# node_modules / dist / .next live in NAMED VOLUMES (never on your host and
# never clobbering the bind mount), so native modules match the Linux container.
#
# Bring it up with ./dev.sh up  (or `make up`), which always passes
#   --env-file .env.docker  so this never collides with the LXD .env.
#
# KVM NOTE: actually launching VMs needs /dev/kvm, which Docker Desktop on Mac
# does not expose. The control plane (GraphQL API, pools, DB, UI) runs fine;
# VM create/start works only on a Linux KVM host via docker-compose.kvm.yml.

name: infinibay-dev

x-npm-age: &npm-age "0" # neutralise .npmrc minimum-release-age for dev installs

services:
  postgres:
    # Fully-qualified so podman resolves it without needing
    # unqualified-search-registries in /etc/containers/registries.conf (rootful
    # podman on Debian doesn't default bare names to docker.io, which failed with
    # 'short-name "postgres:16-bookworm" did not resolve to an alias').
    image: docker.io/library/postgres:16-bookworm
    restart: unless-stopped
    # Bundled DB runs only under the "managed-db" profile (the default set by the
    # setup TUI / dev.sh). Choosing an EXTERNAL database clears COMPOSE_PROFILES so
    # this service is excluded and the backend uses DATABASE_URL instead.
    profiles: ["managed-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infinibay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infinibay}
      POSTGRES_DB: ${POSTGRES_DB:-infinibay}
    ports:
      # PORT_BIND pins the host interface published ports bind to (LAN-only control).
      - "${PORT_BIND:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infinibay} -d ${POSTGRES_DB:-infinibay}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    # Dockerfile lives IN the backend repo (multi-stage); we build its dev target.
    build:
      context: ${REPOS_DIR:-./repos}/backend
      target: dev
    image: infinibay/dev-backend
    restart: unless-stopped
    init: true
    working_dir: /workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
        # required:false → when an EXTERNAL DB is chosen (managed-db profile off,
        # postgres excluded) this dependency is skipped instead of erroring.
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "4000"
      # NOTE: do NOT enable TS_NODE_TRANSPILE_ONLY here. The backend uses
      # TypeGraphQL, which infers GraphQL types from cross-file decorator
      # reflection metadata; single-file transpilation emits `Object` for
      # imported types and resolvers throw NoExplicitTypeError at boot. Full
      # type-checking (the default) is required, even though restarts are slower.
      # Managed DB derives this from POSTGRES_*. An EXTERNAL DB overrides DATABASE_URL
      # + PG* via docker-compose.external-db.yml (added by dev.sh when DATABASE_URL is
      # set) — kept in a separate file because podman-compose can't nest ${A:-${B}}.
      DATABASE_URL: postgresql://${POSTGRES_USER:-infinibay}:${POSTGRES_PASSWORD:-infinibay}@postgres:5432/${POSTGRES_DB:-infinibay}?schema=public
      # pg_isready wait (entrypoint)
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-infinibay}
      PGPASSWORD: ${POSTGRES_PASSWORD:-infinibay}
      PGDATABASE: ${POSTGRES_DB:-infinibay}
      # auth / app
      TOKENKEY: ${TOKENKEY:-dev-insecure-change-me}
      # Cluster mTLS-server / join bootstrap secret. Must be SET for the master's
      # cluster server (:4433) to start; already-joined nodes authenticate via
      # their mTLS cert (not this value). Injected explicitly so it survives a
      # bare `compose up` (not only a shell-exported dev.sh run).
      INFINIBAY_CLUSTER_TOKEN: ${INFINIBAY_CLUSTER_TOKEN:-}
      # Stable master identity. INFINIBAY_NODE_NAME MUST match the master's Node
      # row name so this host re-adopts its own node (and its VMs) across
      # recreates instead of registering a fresh random-hostname node. MTLS=1
      # starts the cluster ops server (:4433) for remote compute nodes.
      INFINIBAY_NODE_NAME: ${INFINIBAY_NODE_NAME:-}
      INFINIBAY_NODE_ROLE: ${INFINIBAY_NODE_ROLE:-master}
      INFINIBAY_CLUSTER_MTLS: ${INFINIBAY_CLUSTER_MTLS:-}
      # Port the cluster mTLS ops server binds when MTLS=1 (heartbeat / DB-RPC /
      # cert-renew for remote nodes). Must match the published port below and the
      # node's MASTER_CLUSTER_URL (https://<master>:4433).
      INFINIBAY_CLUSTER_PORT: ${INFINIBAY_CLUSTER_PORT:-4433}
      # QEMU seccomp sandbox opt-out. This dev stack runs QEMU inside a rootless
      # (podman) container whose substrate seccomp policy kills a sandboxed QEMU
      # device-init syscall with SIGSYS ("VM exited during startup … signal
      # SIGSYS"), so VM creation fails before the guest boots. Default it OFF for
      # dev so VMs boot out of the box; the backend keeps the sandbox ON whenever
      # this is unset/!= "1". NOT for production — export
      # INFINIZATION_DISABLE_SANDBOX=0 on a substrate where the sandbox works.
      INFINIZATION_DISABLE_SANDBOX: ${INFINIZATION_DISABLE_SANDBOX:-1}
      # Master secret for signing commands to the in-guest infiniservice agent.
      # Per-VM key = HMAC(this, vmId). Unset => agent rejects all commands.
      INFINISERVICE_HMAC_MASTER_SECRET: ${INFINISERVICE_HMAC_MASTER_SECRET:-dev-insecure-change-me}
      ALLOW_INSECURE_JWT_FALLBACK: "1"
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      # Explicit origins (NOT '*'): the backend sets credentials:true, and a browser
      # refuses '*' with credentials. It also splits ALLOWED_ORIGINS on ',' and does
      # an exact match, so '*' never matches a real origin → no Allow-Origin header.
      # Both localhost and 127.0.0.1 are listed so either browse host works.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # socket.io CORS. SocketService prefers ALLOWED_ORIGINS (multi-origin) and
      # falls back to FRONTEND_URL. dev.sh keeps both aligned; never '*' here
      # because socket.io sets credentials:true and a browser rejects '*'+creds.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000,http://127.0.0.1:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # host advertised to VMs (SPICE/graphics + asset fetch). localhost in dev.
      APP_HOST: ${APP_HOST:-localhost}
      GRAPHIC_HOST: ${GRAPHIC_HOST:-localhost}
      RPC_URL: ${RPC_URL:-http://localhost:9090}
      # filesystem roots (shared infinibay_base volume)
      INFINIBAY_BASE_DIR: /opt/infinibay
      # VM disk dir — kept INSIDE the shared infinibay_base volume (not the old
      # ephemeral /var/lib/infinization/disks) so (a) disks survive container
      # recreates and (b) it is IDENTICAL to a compute node's disk dir. Cross-node
      # cold migration pushes the disk's ABSOLUTE path verbatim and the receiving
      # node's LocalDiskStore rejects any path outside its own diskDir, so master
      # and node MUST agree — keep this == docker-compose.node.yml's INFINIZATION_DISK_DIR.
      INFINIZATION_DISK_DIR: ${INFINIZATION_DISK_DIR:-/opt/infinibay/disks}
      # storage backend the setup TUI selected (drives migration copy-vs-skip via
      # app/services/storage). Must be in the container env, not just the --env-file.
      INFINIBAY_STORAGE_BACKEND: ${INFINIBAY_STORAGE_BACKEND:-local}
      INFINIBAY_SHARED_STORAGE: ${INFINIBAY_SHARED_STORAGE:-false}
      # optional admin bootstrap consumed by the seed if present
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-password}
      # setup TUI marker: seed sets AppSettings.devModeAdmin=true → /setup forces a
      # password change when the insecure dev-default admin was used.
      INFINIBAY_DEV_MODE_ADMIN: ${INFINIBAY_DEV_MODE_ADMIN:-}
      # dev ergonomics
      RUN_SEED: ${RUN_SEED:-true}
      CHOKIDAR_USEPOLLING: "true"
      NPM_CONFIG_MINIMUM_RELEASE_AGE: *npm-age
      # SPICE/VNC console relay (SpiceProxyService): allocates a per-session
      # listener in this range on the master. Must match the published range
      # below so a browser can reach master:<port>. 20 ports = 20 concurrent
      # consoles in dev; widen for larger fleets.
      SPICE_PROXY_PORT_MIN: ${SPICE_PROXY_PORT_MIN:-6100}
      SPICE_PROXY_PORT_MAX: ${SPICE_PROXY_PORT_MAX:-6119}
    ports:
      # PORT_BIND pins the host interface (LAN-only control); default 0.0.0.0.
      - "${PORT_BIND:-0.0.0.0}:${BACKEND_PORT:-4000}:4000"
      # Console relay range — keep in sync with SPICE_PROXY_PORT_MIN/MAX above.
      - "${PORT_BIND:-0.0.0.0}:${SPICE_PROXY_PORT_MIN:-6100}-${SPICE_PROXY_PORT_MAX:-6119}:${SPICE_PROXY_PORT_MIN:-6100}-${SPICE_PROXY_PORT_MAX:-6119}"
      # Cluster mTLS ops server (only listens when INFINIBAY_CLUSTER_MTLS=1). Published
      # so REAL remote compute nodes can reach it (heartbeat / DB-RPC / cert renew).
      # Harmless when mTLS is off — nothing binds it, so the port just refuses connects.
      - "${PORT_BIND:-0.0.0.0}:${INFINIBAY_CLUSTER_PORT:-4433}:${INFINIBAY_CLUSTER_PORT:-4433}"
    volumes:
      - ${REPOS_DIR:-./repos}/backend:/workspace/backend
      - ${REPOS_DIR:-./repos}/infinization:/workspace/infinization
      - ./docker:/workspace/scripts:ro
      - backend_node_modules:/workspace/backend/node_modules
      - infinization_node_modules:/workspace/infinization/node_modules
      - infinization_dist:/workspace/infinization/dist
      - infinibay_base:/opt/infinibay
    command: ["bash", "/workspace/scripts/entrypoint-backend.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s # first boot installs deps + builds infinization

  frontend:
    # Dockerfile lives IN the frontend repo (multi-stage); we build its dev target.
    build:
      context: ${REPOS_DIR:-./repos}/frontend
      target: dev
    image: infinibay/dev-frontend
    restart: unless-stopped
    init: true
    working_dir: /workspace/frontend
    depends_on:
      - backend # started, not healthy: let the UI install in parallel
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      HUSKY: "0"
      # Browser-facing URLs, BAKED into the bundle → must resolve from whatever
      # device loads the UI. dev.sh fills these with the host LAN IP so remote
      # devices work; falls back to localhost for local-only use.
      NEXT_PUBLIC_BACKEND_HOST: ${NEXT_PUBLIC_BACKEND_HOST:-http://localhost:4000}
      NEXT_PUBLIC_GRAPHQL_API_URL: ${NEXT_PUBLIC_GRAPHQL_API_URL:-http://localhost:4000/graphql}
      # Next.js 16 blocks dev-server resources (HMR WebSocket) from any origin not
      # in allowedDevOrigins — so loading the UI from the host LAN IP fails its HMR
      # ws ("ws://<lan-ip>:3000/_next/webpack-hmr failed") even though the app works.
      # dev.sh exports the auto-detected HOST_IP; pass it through so the LAN origin
      # is allowed (next.config.js reads NEXT_ALLOWED_DEV_ORIGINS, comma-separated).
      NEXT_ALLOWED_DEV_ORIGINS: ${HOST_IP:-}
      # reliable HMR over Docker Desktop's filesystem
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NPM_CONFIG_MINIMUM_RELEASE_AGE: *npm-age
    ports:
      - "${PORT_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ${REPOS_DIR:-./repos}/frontend:/workspace/frontend
      - ./docker:/workspace/scripts:ro
      - frontend_node_modules:/workspace/frontend/node_modules
      - frontend_next:/workspace/frontend/.next
    command: ["bash", "/workspace/scripts/entrypoint-frontend.sh"]

  # Optional: cross-compiles the Rust guest agent (Windows .exe + Linux ELF) and
  # drops the artifacts into the shared infinibay_base volume where the backend
  # serves them to guests. NOT started by default (it is slow and the agent only
  # runs inside real VMs). Run with:  ./dev.sh build-infiniservice
  infiniservice-builder:
    profiles: ["builders"]
    build:
      context: .
      dockerfile: docker/infiniservice.Dockerfile
    image: infinibay/dev-infiniservice-builder
    working_dir: /workspace/infiniservice
    environment:
      INFINIBAY_BASE_DIR: /opt/infinibay
    volumes:
      - ${REPOS_DIR:-./repos}/infiniservice:/workspace/infiniservice
      - ./docker:/workspace/scripts:ro
      - infiniservice_target:/workspace/infiniservice/target
      - infiniservice_cargo:/usr/local/cargo/registry
      - infinibay_base:/opt/infinibay
    command: ["bash", "/workspace/scripts/entrypoint-infiniservice.sh"]

volumes:
  pgdata:
  backend_node_modules:
  infinization_node_modules:
  infinization_dist:
  frontend_node_modules:
  frontend_next:
  infiniservice_target:
  infiniservice_cargo:
  infinibay_base:
