# Infinibay Backup Configuration
#
# This file configures the backup system for Infinibay.
# Environment variables with the same name will override these settings.
#
# Retention Policy:
#   - Manual backups (manual_*): Never automatically deleted
#   - Update/Upgrade backups (update_*, upgrade_*): Kept for BACKUP_UPDATE_RETENTION_DAYS (30 days)
#   - Scheduled backups (scheduled_*): Kept within BACKUP_RETENTION_DAYS (7 days) OR last BACKUP_RETENTION_COUNT (10),
#     whichever keeps more backups (union of both sets)
#
# Scheduled backups are disabled by default. Enable them with:
#   ./run.sh backup --enable-schedule

# Enable/disable backup functionality globally
# When set to "false", this disables:
#   - Manual backups (./run.sh backup)
#   - Scheduled backups (cron-triggered)
#   - Automatic backups created by 'update' and 'upgrade' commands
# This is a safety switch to prevent all backup operations.
BACKUP_ENABLED="true"

# Cron schedule for automated backups (default: daily at 2 AM)
# Format: minute hour day-of-month month day-of-week
# Examples:
#   "0 2 * * *"     - Daily at 2:00 AM
#   "0 3 * * 0"     - Weekly on Sunday at 3:00 AM
#   "0 4 1 * *"     - Monthly on the 1st at 4:00 AM
BACKUP_SCHEDULE="0 2 * * *"

# Retention period for scheduled backups in days
# Scheduled backups older than this will be deleted during cleanup
BACKUP_RETENTION_DAYS="7"

# Maximum number of scheduled backups to keep
# Combined with BACKUP_RETENTION_DAYS using union semantics:
# A backup is kept if it is within BACKUP_RETENTION_DAYS OR is one of the last BACKUP_RETENTION_COUNT
# This ensures you always have at least BACKUP_RETENTION_COUNT backups, even if they're older than BACKUP_RETENTION_DAYS
BACKUP_RETENTION_COUNT="10"

# Retention period for update/upgrade backups in days
# Update and upgrade backups are kept longer as they represent important system states
BACKUP_UPDATE_RETENTION_DAYS="30"

# Directory path where backups are stored (inside postgres container)
# This should be a path that has sufficient disk space
BACKUP_LOCATION="/data/backups"
