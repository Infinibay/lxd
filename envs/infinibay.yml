# Infinibay LXD Compose Environment
# Deploy Infinibay VDI platform using LXD containers

version: "1"

template_engine:
  engine: "mottainai"

# Projects
projects:
  - name: "infinibay"
    description: "Infinibay VDI Management Platform"

    # Environment variables for all containers
    vars:
      - envs:
          DB_NAME: "{{ .Values.DB_NAME }}"
          DB_USER: "{{ .Values.DB_USER }}"
          DB_PASSWORD: "{{ .Values.DB_PASSWORD }}"
          DB_HOST: "infinibay-postgres"
          DB_PORT: "{{ .Values.DB_PORT }}"
          HOST_IP: "{{ .Values.HOST_IP }}"
          BACKEND_PORT: "{{ .Values.BACKEND_PORT }}"
          FRONTEND_PORT: "{{ .Values.FRONTEND_PORT }}"
          ADMIN_EMAIL: "{{ .Values.ADMIN_EMAIL }}"
          ADMIN_PASSWORD: "{{ .Values.ADMIN_PASSWORD }}"
          TOKENKEY: "{{ .Values.TOKENKEY }}"
          LIBVIRT_NETWORK_NAME: "{{ .Values.LIBVIRT_NETWORK_NAME }}"
          INFINIBAY_BASE_DIR: "/opt/infinibay"
          INFINIBAY_DATA_DIR: "/data"

    # Groups define sets of containers
    groups:
      # PostgreSQL Database
      - name: "database"
        description: "PostgreSQL Database"
        connection: "local"

        common_profiles:
          - default
          - infinibay-base

        # Nodes are the actual containers
        nodes:
          - name: "infinibay-postgres"
            image_source: "22.04"
            image_remote_server: "ubuntu"

            profiles:
              - infinibay-postgres

            config:
              limits.memory: "{{ .Values.POSTGRES_MEMORY_LIMIT }}"
              limits.cpu: 2

            # TODO: Cloud-init configuration for PostgreSQL
            # hooks:
            #   - event: post-node-creation
            #     commands:
            #       - apt-get update
            #       - apt-get install -y postgresql postgresql-contrib

      # Backend API
      - name: "backend"
        description: "Backend GraphQL API with KVM access"
        connection: "local"

        common_profiles:
          - default
          - infinibay-base

        nodes:
          - name: "infinibay-backend"
            image_source: "24.04"
            image_remote_server: "ubuntu"

            profiles:
              - infinibay-backend

            config:
              limits.memory: "{{ .Values.BACKEND_MEMORY_LIMIT }}"
              limits.cpu: 4
              security.nesting: "true"

      # Frontend UI
      - name: "frontend"
        description: "Next.js Frontend"
        connection: "local"

        common_profiles:
          - default
          - infinibay-base

        nodes:
          - name: "infinibay-frontend"
            image_source: "22.04"
            image_remote_server: "ubuntu"

            profiles:
              - infinibay-frontend

            config:
              limits.memory: "{{ .Values.FRONTEND_MEMORY_LIMIT }}"
              limits.cpu: 2
